name: Research
description: Investigate technical uncertainties and document decisions for Promptly.
labels:
  - agent-task

body:
  - type: markdown
    attributes:
      value: |
        Research one clearly defined question per issue.
        Prioritize official documentation and reproducible evidence.
        Distinguish documented facts, observations, and assumptions.
        Do not implement production changes as part of research.

  - type: input
    id: question
    attributes:
      label: Research Question
      description: State the specific question or uncertainty to resolve.
      placeholder: "Can Promptly reliably exclude its window from screen capture on macOS 26?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this investigation is necessary and what is already known.
      placeholder: |
        The PRD requires screen-sharing privacy.
        NSWindow.sharingType is deprecated.
        We need to establish which capture mechanisms can
        reliably exclude Promptly's window.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what must be investigated, including relevant alternatives.
      placeholder: |
        - Review official Apple documentation.
        - Evaluate available macOS 26 APIs.
        - Compare viable implementation approaches.
        - Identify compatibility and security limitations.
    validations:
      required: true

  - type: textarea
    id: evaluation-criteria
    attributes:
      label: Evaluation Criteria
      description: Define how alternatives should be compared.
      placeholder: |
        - Compatibility with macOS 26+
        - Reliability and observable behavior
        - Privacy and security implications
        - Implementation complexity
        - Maintenance and performance costs
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Expected Deliverables
      description: Specify the evidence and conclusions required to complete the research.
      value: |
        - [ ] Relevant alternatives investigated.
        - [ ] Findings supported by linked sources or reproducible tests.
        - [ ] Documented facts distinguished from observations and assumptions.
        - [ ] Tradeoffs and limitations identified.
        - [ ] Recommended approach with justification.
        - [ ] Unresolved questions and follow-up tasks identified.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Specify required experiments, prototypes, or compatibility checks.
      placeholder: |
        - Verify API availability against the macOS 26 SDK.
        - Test relevant capture mechanisms on a physical Mac.
        - Record environment, reproduction steps, and results.
        - Identify any checks that could not be performed.

  - type: input
    id: references
    attributes:
      label: Related Requirements
      description: Reference PRD sections, architecture documents, or related issues.
      placeholder: "Docs/PRD.md — PRD-06; #12"

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Exclusions
      description: Define boundaries for the research task.
      placeholder: |
        - Do not modify production code.
        - Use disposable experiments if needed.
        - Do not introduce dependencies without approval.
        - Do not claim universal compatibility without evidence.

  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Optional existing research, documentation links, or known limitations.
      placeholder: "Previous findings, useful references, or related discussions."
