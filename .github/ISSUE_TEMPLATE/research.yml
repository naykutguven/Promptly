name: Research
description: Investigate technical uncertainties and document decisions for Promptly.
labels:
  - agent-task

body:
  - type: markdown
    attributes:
      value: |
        Research one clearly defined question per issue.
        Prioritize official documentation and reproducible evidence.
        Distinguish documented facts, observations, inferences, and assumptions.
        Do not implement production changes as part of research.

  - type: input
    id: question
    attributes:
      label: Research Question
      description: State the specific question or uncertainty to resolve.
      placeholder: "Under which capture configurations, if any, can Promptly avoid appearing on macOS 26.0+?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this investigation is necessary and what is already known.
      placeholder: |
        PRD-06 requires capture-compatibility testing and accurate disclosure of limitations.
        We need evidence about Promptly's visibility in window and display capture
        before choosing an approach or making compatibility claims.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define what must be investigated, including relevant alternatives.
      placeholder: |
        - Review official Apple documentation.
        - Evaluate native default behavior and APIs available on macOS 26.0+.
        - Compare viable implementation approaches.
        - Identify compatibility and security limitations.
    validations:
      required: true

  - type: textarea
    id: evaluation-criteria
    attributes:
      label: Evaluation Criteria
      description: Define how alternatives should be compared.
      placeholder: |
        - Compatibility with the macOS 26.0 minimum deployment target
        - Reliability and observable behavior
        - Privacy and security implications
        - Implementation complexity
        - Maintenance and performance costs
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Expected Deliverables
      description: >-
        Customize the completion checklist. Findings go in an issue comment by default;
        name any required Docs/Research/... document in the checklist and link it from the issue.
      value: |
        - [ ] Findings recorded in an issue comment, with links to any required research documents and experiment artifacts.
        - [ ] Relevant alternatives compared against the evaluation criteria.
        - [ ] Material claims supported by linked primary sources or reproducible experiments.
        - [ ] Documented facts, observations, inferences, and assumptions distinguished.
        - [ ] Checks performed and skipped recorded, with relevant versions, reproduction steps, results, and implications for confidence.
        - [ ] Tradeoffs, limitations, and remaining implementation gates identified.
        - [ ] Recommendation justified against the evaluation criteria: proceed, defer, reject, or investigate further.
        - [ ] Unresolved questions and follow-up tasks identified.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: >-
        Specify task-specific experiments, prototypes, or compatibility checks,
        or explain why a documentation review is sufficient.
      placeholder: |
        - Verify macOS 26.0 API availability using SDK declarations.
        - Test relevant capture applications and window/display capture modes on a physical Mac.
        - Record exact OS, SDK/toolchain, and app versions, configuration, reproduction steps, and results.
        - Identify skipped or unavailable checks and explain what remains unproven.

  - type: input
    id: references
    attributes:
      label: Related Requirements
      description: Reference PRD sections, architecture documents, or related issues.
      placeholder: "Docs/PRD.md — PRD-06; #12"

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and Exclusions
      description: Keep the research-only boundaries and add task-specific constraints or exclusions.
      value: |
        - Research only; do not modify production code or project configuration.
        - Follow AGENTS.md, README product contracts, and the relevant task guides.
        - Prioritize official documentation and reproducible evidence.
        - Use isolated, disposable experiments with synthetic content when needed.
        - Do not introduce dependencies without approval.
        - Do not claim compatibility or guarantees beyond the evidence collected.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Optional existing research, documentation links, or known limitations.
      placeholder: "Previous findings, useful references, or related discussions."
