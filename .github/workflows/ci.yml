name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS CI
    # The project.xcproj format and Swift 6.4 require the Xcode 27 image.
    runs-on: xcode-27
    # Runs took about 3 minutes before the Thread Sanitizer build was added. Each
    # step also has its own limit; the job limit stops a run in which several steps
    # are slow at once.
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # Scripts/tests.sh writes test results and logs to build/Tests.
      CI_RESULTS: build/CI

    steps:
      - name: Check out the merge result
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Record toolchain and runner
        id: environment
        timeout-minutes: 1
        run: |
          mkdir -p "$CI_RESULTS"
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk macosx --show-sdk-version
          } 2>&1 | tee "$CI_RESULTS/environment.log"

      # The linter pins live in the script, so changing it starts a new cache entry.
      # Caching is an optimization; a cache failure must not block installation.
      - name: Restore cached linters
        id: linters_cache
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/quality-tools
          key: linters-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/linters.sh') }}

      # Three downloads can each take up to 135 seconds with retries. Cached tools
      # pass the version check without downloading.
      - name: Install pinned linters
        id: install_linters
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          ./Scripts/linters.sh install 2>&1 | tee "$CI_RESULTS/linters-install.log"

      # Save immediately so later build or test failures don't prevent caching.
      - name: Save linters to cache
        if: ${{ !cancelled() && steps.install_linters.outcome == 'success' && steps.linters_cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .build/quality-tools
          key: ${{ steps.linters_cache.outputs.cache-primary-key }}

      - name: Lint Swift with SwiftLint
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          ./Scripts/linters.sh lint-swift 2>&1 | tee "$CI_RESULTS/swiftlint.log"

      - name: Check Swift formatting with swift-format
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          ./Scripts/linters.sh lint-swift-format 2>&1 | tee "$CI_RESULTS/swift-format.log"

      - name: Lint workflows with actionlint
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          ./Scripts/linters.sh lint-actions 2>&1 | tee "$CI_RESULTS/actionlint.log"

      - name: Lint shell scripts with ShellCheck
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          ./Scripts/linters.sh lint-shell 2>&1 | tee "$CI_RESULTS/shellcheck.log"

      - name: Build app and both test targets (Debug)
        id: debug_build
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 10
        run: ./Scripts/tests.sh build-for-testing

      # Fails when no unit test passes or any test fails. Reports code coverage, or
      # warns when Xcode could not collect it.
      - name: Run unit tests
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        timeout-minutes: 10
        run: ./Scripts/tests.sh test-unit

      - name: Build Apple silicon app (Release)
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 10
        run: ./Scripts/tests.sh build-release

      # Thread Sanitizer needs its own instrumented build.
      - name: Run unit tests with Thread Sanitizer
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 10
        run: ./Scripts/tests.sh test-tsan

      # Non-blocking until the UI tests pass on the hosted runner. Runs last with a
      # short limit, so a hung UI test can't use up the time of the blocking steps.
      # The suite takes under a minute locally.
      - name: Run UI tests (non-blocking)
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: ./Scripts/tests.sh test-ui

      - name: Summarize test results
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        timeout-minutes: 2
        run: ./Scripts/tests.sh summarize

      - name: Upload logs and test results
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-ci-results-${{ github.run_attempt }}
          path: |
            ${{ env.CI_RESULTS }}
            build/Tests
          if-no-files-found: warn
          retention-days: 7
